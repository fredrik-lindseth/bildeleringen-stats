<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bildeleringen Fleksibel</title>
  <link rel="stylesheet" href="finder.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <span class="header__title">Fleksibelt søk</span>
      <span class="header__sub">Finn når bilen faktisk er ledig</span>
    </div>
  </header>

  <main class="layout">
    <form id="wish" class="wish">
      <div class="wish__body">
      <div class="field">
        <label class="label" for="place">Posisjon</label>
        <select id="place" class="control"></select>
      </div>

      <div class="field">
        <span class="label">Tidsrom</span>
        <div class="cal">
          <div class="cal__head">
            <button type="button" class="cal__nav" id="calPrev" aria-label="Forrige måned">‹</button>
            <span class="cal__month" id="calMonth"></span>
            <button type="button" class="cal__nav" id="calNext" aria-label="Neste måned">›</button>
          </div>
          <div class="cal__grid" id="calGrid"></div>
        </div>
        <div class="times">
          <div>
            <span class="mini">Fra kl.</span>
            <select id="startTime" class="control" aria-label="Starttid"></select>
          </div>
          <div>
            <span class="mini">Til kl.</span>
            <select id="endTime" class="control" aria-label="Slutttid"></select>
          </div>
        </div>
        <div class="range-summary" id="rangeSummary" aria-live="polite"></div>
      </div>

      <fieldset class="field duration">
        <legend>Varighet</legend>
        <div class="seg">
          <label><input type="radio" name="mode" value="whole" checked /> Hele vinduet</label>
          <label><input type="radio" name="mode" value="duration" /> Bestemt lengde</label>
        </div>
        <div class="duration__hours is-disabled" id="hoursRow">
          <input type="number" id="hours" class="control" min="1" value="24" aria-label="Antall timer" />
          <span>timer i vinduet</span>
        </div>
      </fieldset>

      <details class="more">
        <summary>Flere filtre <span class="more__hint" id="filterHint"></span></summary>
        <div class="more__content">
          <div class="field">
            <span class="label">Biltype</span>
            <div class="chips" id="categoryChips" role="group" aria-label="Biltype"></div>
          </div>

          <div class="field">
            <span class="label">Drivstoff</span>
            <div class="chips" id="fuelChips" role="group" aria-label="Drivstoff"></div>
          </div>

          <div class="field">
            <label class="label" for="maxdist">Maks gangavstand</label>
            <select id="maxdist" class="control">
              <option value="500">500 m</option>
              <option value="1000">1 km</option>
              <option value="2000">2 km</option>
              <option value="5000">5 km</option>
              <option value="" selected>Uansett</option>
            </select>
          </div>
        </div>
      </details>
      </div>

      <div class="wish__foot">
        <button type="submit" class="submit">Søk</button>
      </div>
    </form>

    <section id="results" class="results" aria-live="polite">
      <p class="hint">Velg tidsrom og trykk Søk.</p>
    </section>
  </main>

  <script type="module" src="finder.js"></script>
</body>
</html>
